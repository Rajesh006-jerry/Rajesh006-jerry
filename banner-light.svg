      <circle cx="430" cy="700" r="2.1" fill="#4a45c9"><animate attributeName="cy" values="700;-20" dur="8s" begin="2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="8s" begin="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="880" cy="700" r="1.6" fill="#8b3fd6"><animate attributeName="cy" values="700;-20" dur="7.5s" begin="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7.5s" begin="1.6s" repeatCount="indefinite"/></circle>
