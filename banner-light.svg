<svg width="1280" height="740" viewBox="0 0 1280 740" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="roundedBannerL"><rect x="0" y="0" width="1280" height="740" rx="28"/></clipPath>

    <linearGradient id="bgGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf6ff"/>
      <stop offset="50%" stop-color="#f5ecff"/>
      <stop offset="100%" stop-color="#fdf6ff"/>
    </linearGradient>

    <linearGradient id="nameGradL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0289b"/>
      <stop offset="50%" stop-color="#8b3fd6"/>
      <stop offset="100%" stop-color="#4a45c9"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="pillGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0289b" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#4a45c9" stop-opacity="0.10"/>
    </linearGradient>

    <linearGradient id="scanGradL" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0289b" stop-opacity="0"/>
      <stop offset="50%" stop-color="#e0289b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#e0289b" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="avatarRevealL">
      <rect x="980" y="60" width="230" height="0" rx="16">
        <animate attributeName="height" from="0" to="300" begin="0.4s" dur="1.6s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/>
      </rect>
    </clipPath>
  </defs>

