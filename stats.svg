<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" width="900" height="460">
  <defs>
    <radialGradient id="bg-glow" cx="25%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#3a1260" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1a0b2e" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="glow-right" cx="85%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#2a0a5e" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1a0b2e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rank-arc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4fd8"/>
      <stop offset="100%" stop-color="#b06bff"/>
    </linearGradient>
    <linearGradient id="bar-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b06bff"/>
      <stop offset="100%" stop-color="#6f6bff"/>
    </linearGradient>
    <filter id="glow-text">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Full background -->
  <rect width="900" height="460" fill="#1a0b2e"/>
  <rect width="900" height="460" fill="url(#bg-glow)"/>
  <rect width="900" height="460" fill="url(#glow-right)"/>

  <!-- Subtle star dots -->
  <circle cx="50" cy="30" r="1" fill="#c9b6ff" opacity="0.5"/>
  <circle cx="120" cy="15" r="1.5" fill="#ff4fd8" opacity="0.4"/>
  <circle cx="230" cy="40" r="1" fill="#c9b6ff" opacity="0.3"/>
  <circle cx="420" cy="12" r="1" fill="#b06bff" opacity="0.5"/>
  <circle cx="580" cy="25" r="1.5" fill="#ff4fd8" opacity="0.35"/>
  <circle cx="700" cy="10" r="1" fill="#c9b6ff" opacity="0.4"/>
  <circle cx="820" cy="35" r="1" fill="#b06bff" opacity="0.5"/>
  <circle cx="870" cy="18" r="1.5" fill="#ff4fd8" opacity="0.3"/>
  <circle cx="30" cy="200" r="1" fill="#6f6bff" opacity="0.4"/>
  <circle cx="880" cy="300" r="1.5" fill="#c9b6ff" opacity="0.35"/>
  <circle cx="60" cy="430" r="1" fill="#ff4fd8" opacity="0.3"/>
  <circle cx="850" cy="440" r="1" fill="#b06bff" opacity="0.4"/>

  <!-- Section Title -->
  <text x="450" y="46" fill="#ff4fd8" font-family="'Courier New', Courier, monospace" font-size="18" font-weight="bold" text-anchor="middle" filter="url(#glow-text)">&#x1F4CA; GitHub Stats &amp; Graphs</text>

  <!-- ===== LEFT CARD: GitHub Stats ===== -->
  <rect x="22" y="62" width="405" height="375" rx="14" fill="#12072a" stroke="#b06bff" stroke-width="1.2" stroke-opacity="0.45"/>
  <text x="225" y="95" fill="#e0ccff" font-family="'Courier New', Courier, monospace" font-size="14" font-weight="bold" text-anchor="middle">GitHub Stats</text>

  <!-- Rank ring (SVG arc approximation) -->
  <!-- Track circle -->
  <circle cx="115" cy="210" r="62" fill="none" stroke="#2d1b4e" stroke-width="9"/>
  <!-- Progress arc: circumference = 2π*62 ≈ 389.6; ~80% fill ≈ 311.7 offset -->
  <circle cx="115" cy="210" r="62" fill="none" stroke="url(#rank-arc)" stroke-width="9"
          stroke-dasharray="389.6" stroke-dashoffset="78"
          stroke-linecap="round"
          transform="rotate(-90 115 210)"/>
  <text x="115" y="202" fill="#e0ccff" font-family="'Courier New', Courier, monospace" font-size="30" font-weight="bold" text-anchor="middle">A</text>
  <text x="115" y="222" fill="#b06bff" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="middle">rank (sample)</text>

  <!-- Stats rows -->
  <!-- Row 1 -->
  <text x="202" y="148" fill="#ff4fd8" font-family="'Courier New', Courier, monospace" font-size="12">&#11088; Featured Projects</text>
  <text x="408" y="148" fill="#c9b6ff" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="bold" text-anchor="end">2</text>

  <!-- Row 2 -->
  <text x="202" y="178" fill="#ff4fd8" font-family="'Courier New', Courier, monospace" font-size="12">&#128296; Core Toolkit</text>
  <text x="408" y="197" fill="#c9b6ff" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="end">Jira · Figma · Git</text>

  <!-- Row 3 -->
  <text x="202" y="224" fill="#ff4fd8" font-family="'Courier New', Courier, monospace" font-size="12">&#127919; Focus</text>
  <text x="408" y="243" fill="#c9b6ff" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="end">AI Product Thinking</text>

  <!-- Row 4 -->
  <text x="202" y="270" fill="#ff4fd8" font-family="'Courier New', Courier, monospace" font-size="12">&#127891; Education</text>
  <text x="408" y="289" fill="#c9b6ff" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="end">BCA, Univ. of Madras</text>

  <!-- Divider -->
  <line x1="44" y1="365" x2="406" y2="365" stroke="#2d1b4e" stroke-width="1"/>
  <text x="225" y="400" fill="#5a4a7e" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="middle">sample values — swap in your live stats anytime</text>

  <!-- ===== RIGHT CARD: Top Skills ===== -->
  <rect x="473" y="62" width="405" height="375" rx="14" fill="#12072a" stroke="#b06bff" stroke-width="1.2" stroke-opacity="0.45"/>
  <text x="675" y="95" fill="#e0ccff" font-family="'Courier New', Courier, monospace" font-size="14" font-weight="bold" text-anchor="middle">Top Skills</text>

  <!-- Skill 1: Product Management (~82%) -->
  <text x="494" y="130" fill="#c9b6ff" font-family="'Courier New', Courier, monospace" font-size="11">Product Management</text>
  <rect x="494" y="137" width="363" height="9" rx="4.5" fill="#2d1b4e"/>
  <rect x="494" y="137" width="298" height="9" rx="4.5" fill="url(#bar-grad)"/>

  <!-- Skill 2: Generative AI (~75%) -->
  <text x="494" y="178" fill="#c9b6ff" font-family="'Courier New', Courier, monospace" font-size="11">Generative AI / Prompt Engineering</text>
  <rect x="494" y="185" width="363" height="9" rx="4.5" fill="#2d1b4e"/>
  <rect x="494" y="185" width="272" height="9" rx="4.5" fill="url(#bar-grad)"/>

  <!-- Skill 3: SQL / Excel / Tableau (~63%) -->
  <text x="494" y="226" fill="#c9b6ff" font-family="'Courier New', Courier, monospace" font-size="11">SQL / Excel / Tableau</text>
  <rect x="494" y="233" width="363" height="9" rx="4.5" fill="#2d1b4e"/>
  <rect x="494" y="233" width="229" height="9" rx="4.5" fill="url(#bar-grad)"/>

  <!-- Skill 4: HTML / CSS / JavaScript (~55%) -->
  <text x="494" y="274" fill="#c9b6ff" font-family="'Courier New', Courier, monospace" font-size="11">HTML / CSS / JavaScript</text>
  <rect x="494" y="281" width="363" height="9" rx="4.5" fill="#2d1b4e"/>
  <rect x="494" y="281" width="200" height="9" rx="4.5" fill="url(#bar-grad)"/>

  <!-- Skill 5: Python / Java (~40%) -->
  <text x="494" y="322" fill="#c9b6ff" font-family="'Courier New', Courier, monospace" font-size="11">Python / Java (basics)</text>
  <rect x="494" y="329" width="363" height="9" rx="4.5" fill="#2d1b4e"/>
  <rect x="494" y="329" width="145" height="9" rx="4.5" fill="url(#bar-grad)"/>

  <!-- Divider -->
  <line x1="493" y1="365" x2="856" y2="365" stroke="#2d1b4e" stroke-width="1"/>
  <text x="675" y="400" fill="#5a4a7e" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="middle">skill weights reflect PM-first profile</text>

  <!-- Bottom sparkle accents -->
  <circle cx="225" cy="445" r="1.2" fill="#b06bff" opacity="0.5"/>
  <circle cx="450" cy="450" r="1.5" fill="#ff4fd8" opacity="0.4"/>
  <circle cx="675" cy="445" r="1.2" fill="#b06bff" opacity="0.5"/>
</svg>
