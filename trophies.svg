<svg width="680" height="170" viewBox="0 0 680 170" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd76a"/>
      <stop offset="100%" stop-color="#ff8b3d"/>
    </linearGradient>
    <linearGradient id="tShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="680" height="170" rx="16" fill="#1a0b2e" stroke="#b06bff44"/>

  <!-- 4 trophy cells popping in -->
  <g font-family="Segoe UI, sans-serif" text-anchor="middle">
    <!-- cell 1 -->
    <g transform="translate(90,85)" opacity="0">
      <animate attributeName="opacity" to="1" begin="0.3s" dur="0.4s" fill="freeze"/>
      <animateTransform attributeName="transform" type="scale" additive="sum" values="0.6;1.08;1" begin="0.3s" dur="0.5s" fill="freeze"/>
      <circle r="48" fill="none" stroke="url(#tGrad)" stroke-width="2"/>
      <text y="-6" font-size="26" fill="#ffd76a">🏆</text>
      <text y="18" font-size="11" fill="#f1e8ff">AI Product</text>
      <text y="32" font-size="11" fill="#f1e8ff">Manager</text>
    </g>
    <!-- cell 2 -->
    <g transform="translate(230,85)" opacity="0">
      <animate attributeName="opacity" to="1" begin="0.5s" dur="0.4s" fill="freeze"/>
      <animateTransform attributeName="transform" type="scale" additive="sum" values="0.6;1.08;1" begin="0.5s" dur="0.5s" fill="freeze"/>
      <circle r="48" fill="none" stroke="url(#tGrad)" stroke-width="2"/>
      <text y="-6" font-size="26" fill="#ffd76a">🚀</text>
      <text y="18" font-size="11" fill="#f1e8ff">2 Shipped</text>
      <text y="32" font-size="11" fill="#f1e8ff">Product Demos</text>
    </g>
    <!-- cell 3 -->
    <g transform="translate(370,85)" opacity="0">
      <animate attributeName="opacity" to="1" begin="0.7s" dur="0.4s" fill="freeze"/>
      <animateTransform attributeName="transform" type="scale" additive="sum" values="0.6;1.08;1" begin="0.7s" dur="0.5s" fill="freeze"/>
      <circle r="48" fill="none" stroke="url(#tGrad)" stroke-width="2"/>
      <text y="-6" font-size="26" fill="#ffd76a">🔍</text>
      <text y="18" font-size="11" fill="#f1e8ff">User &amp; Market</text>
      <text y="32" font-size="11" fill="#f1e8ff">Research</text>
    </g>
    <!-- cell 4 -->
    <g transform="translate(510,85)" opacity="0">
      <animate attributeName="opacity" to="1" begin="0.9s" dur="0.4s" fill="freeze"/>
      <animateTransform attributeName="transform" type="scale" additive="sum" values="0.6;1.08;1" begin="0.9s" dur="0.5s" fill="freeze"/>
      <circle r="48" fill="none" stroke="url(#tGrad)" stroke-width="2"/>
      <text y="-6" font-size="26" fill="#ffd76a">📊</text>
      <text y="18" font-size="11" fill="#f1e8ff">Data-driven</text>
      <text y="32" font-size="11" fill="#f1e8ff">Decisions</text>
    </g>
  </g>

  <!-- shine sweep across the whole card -->
  <rect x="-80" y="0" width="80" height="170" fill="url(#tShine)" transform="skewX(-20)">
    <animateTransform attributeName="transform" type="translate" values="-80,0;760,0" dur="3.5s" begin="1.4s" repeatCount="indefinite" additive="sum"/>
  </rect>
</svg>
